name: sync repos

# Regenera js/data/repos.json (nombres, descripciones, homepage…) desde la API
# de GitHub cada 2 días. Corre en los runners de GitHub: tu PC no ejecuta nada.
on:
  schedule:
    - cron: "0 5 */2 * *" # 05:00 UTC, día sí día no
  workflow_dispatch: # botón "Run workflow" para forzarlo a mano

permissions:
  contents: write

concurrency:
  group: sync-repos
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerar snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-repos.mjs

      - name: Commit si algo cambió
        run: |
          if git diff --quiet -- js/data/repos.json; then
            echo "Sin cambios: las descripciones siguen igual."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data/repos.json
          git commit -m "chore: sincroniza descripciones de repos desde GitHub"
          git push
