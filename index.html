<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rubén Peña</title>
  <meta name="description" content="Rubén Peña — un atajo a mis proyectos, mi trabajo y lo que estoy escuchando.">
  <meta name="author" content="Rubén Peña">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F7F3EC">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Rubén Peña">
  <meta property="og:description" content="Rubén Peña — construyo cosas en internet.">
  <meta property="og:locale" content="es_ES">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top-bar">
    <span class="top-name">Rubén Peña</span>
    <div class="top-right">
      <button id="lang-toggle" class="lang-btn" type="button" aria-label="Cambiar idioma">ES / EN</button>
      <span class="live-dot" aria-hidden="true" title="conectado"></span>
    </div>
  </header>

  <main class="container">
    <section class="hero" aria-labelledby="now-heading">
      <h1 class="display-name">Rubén Peña</h1>
      <p id="role" class="role">Construyo cosas en internet</p>
      <div id="now-line" class="now-line" aria-live="polite">
        <span id="now-text" data-i18n="loading">conectando…</span>
      </div>
      <div id="music-section" class="music-section hidden">
        <img id="music-cover" class="music-cover" alt="" loading="lazy">
        <span id="music-text" class="music-text"></span>
      </div>
      <div id="live-session" class="live-session">
        <details class="live-details">
          <summary class="live-summary">
            <span class="live-dot-small" aria-hidden="true"></span>
            <span data-i18n="live_session">Sesión en vivo</span>
          </summary>
          <div class="live-embed-wrap">
            <iframe src="https://arzuparreta.github.io/soundsible.github.io/live/"
                    class="live-embed"
                    allow="autoplay"
                    loading="lazy"
                    title="SoundSible Live">
            </iframe>
          </div>
        </details>
      </div>
    </section>

    <section class="work" aria-labelledby="work-title">
      <div class="work-header">
        <h2 id="work-title" class="section-title" data-i18n="work">Lo que hago</h2>
        <div class="sort" id="work-sort" role="group" aria-label="Ordenar proyectos">
          <button data-sort="recent" class="active" data-i18n="sort_recent">Recientes</button>
          <button data-sort="stars" data-i18n="sort_stars">Más estrellas</button>
          <button data-sort="live" data-i18n="sort_live">Con web en vivo</button>
        </div>
      </div>
      <div id="work-grid" class="work-grid" role="list"></div>
    </section>

    <section class="connect" aria-labelledby="connect-title">
      <h2 id="connect-title" class="section-title" data-i18n="connect">Conecta</h2>
      <nav class="connect-grid" id="connect-grid" aria-label="Enlaces"></nav>
    </section>
  </main>

  <footer class="footer">
    <p>
      <span data-i18n="footer_by">hecho por mí</span>
      <span class="sep">·</span>
      <span id="footer-time" aria-label="Hora local">--:--</span>
    </p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
